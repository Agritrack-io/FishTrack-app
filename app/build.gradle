plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion(34)


    buildFeatures {
        dataBinding true  // Enable DataBinding (if used)
        viewBinding true
        buildConfig true

    }

    namespace 'io.agritrack.philosofish'

    defaultConfig {
        applicationId "io.agritrack.philosofish"
        minSdkVersion 26
        targetSdk 34
        versionCode 3
        versionName "1.03"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a'
        }

        lintOptions {
            checkReleaseBuilds false
        }
    }

    signingConfigs {
        debug {
            storeFile = rootProject.file("debug.keystore")
        }

        release {
            storeFile = rootProject.file("my-release-key.keystore")
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD

            // Optional, specify signing versions used
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        applicationVariants.all{
            variant ->
                variant.outputs.each{
                    output->
                        def name = "agritrack-philosofish.apk"
                        output.outputFileName = name
                }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDirs = ['src/main/res']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.firebase:protolite-well-known-types:18.0.0'
    implementation 'androidx.databinding:databinding-runtime:7.3.1'
    //implementation 'com.google.android.material:material:1.8.0-rc01'


    implementation "androidx.core:core:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1" // update your old 1.3.1


    //define versions
    def versions_lombok = "1.18.12"
    def versions_room = "2.6.1"
    def versions_work = "2.5.0"
    def versions_jwt = "3.4.1"
    def versions_mail = "1.6.2"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.1'

    // Lombok
//    compileOnly "org.projectlombok:lombok:$versions_lombok"
//    annotationProcessor "org.projectlombok:lombok:$versions_lombok"

    // JWT support
    //implementation group: 'com.auth0', name: 'java-jwt', version: '3.4.1'
    implementation "com.auth0:java-jwt:$versions_jwt"

    // JSON Web Token
    implementation 'com.auth0:java-jwt:4.0.0'

    // used to monitor for app crash events
    implementation 'com.facebook.stetho:stetho:1.6.0'

    implementation 'com.kkmcn.kbeaconlib2:kbeaconlib2:1.2.9'

    // work-runtime
    implementation "androidx.work:work-runtime:$versions_work"

    //card view
    implementation 'androidx.cardview:cardview:1.0.0'

    /*//recyclerview
    implementation 'androidx.recyclerview:recyclerview:1.1.0'*/

    //recyclerview
    implementation "androidx.recyclerview:recyclerview:1.2.0-alpha04"

    implementation 'uk.co.chrisjenx:calligraphy:2.2.0'
    implementation 'com.google.android.material:material:1.4.0'

    //implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'

    // Room
    implementation "androidx.room:room-runtime:$versions_room"
    annotationProcessor "androidx.room:room-compiler:$versions_room"

    // Google gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.6'
    implementation 'com.google.android.gms:play-services-location:17.1.0'

    // jackson
    implementation 'com.fasterxml.jackson.core:jackson-core:2.12.4'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.12.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.4'

    // volley (for retries?)
    implementation 'com.android.volley:volley:1.2.1'

    // rxJava
    implementation 'io.reactivex.rxjava3:rxjava:3.0.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.7.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    // QR Code
    //implementation "androidmads.library.qrgenearator:QRGenearator:1.0.3"


    // OkHttp
    implementation("com.squareup.okhttp3:okhttp:4.9.0")
    implementation("com.squareup.okhttp3:logging-interceptor:4.9.0")

    implementation 'com.facebook.stetho:stetho:1.5.1'

    // Progress dialog
    implementation 'com.github.knight-rider1609:MultiProgressBar:1.1.1'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // Spark Chart library
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // RFID libs
    implementation files('libs/uhfcom13_v20.2.jar')
    implementation files('libs/CAENRFIDLibrary-release.aar')
    implementation files('libs/jxl.jar')
    implementation files('libs/ModuleAPI_J.jar')
    implementation files('libs/UHF6_v1.9.7.jar')

    // LoadingButton  library
    implementation 'com.github.koushikcse:LoadingButton:1.7'

    // Data-binding
    implementation "android.arch.lifecycle:extensions:1.1.0"
    implementation "android.arch.lifecycle:viewmodel:1.1.0"

    // Testing
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    // Email
    implementation "com.sun.mail:android-mail:$versions_mail"
    implementation "com.sun.mail:android-activation:$versions_mail"

    // SQL cipher
    implementation 'net.zetetic:android-database-sqlcipher:4.5.3'

    //OCR
    //implementation 'com.jakewharton:butterknife:10.0.0'
    //annotationProcessor 'com.jakewharton:butterknife-compiler:10.0.0'

    implementation 'com.rmtheis:tess-two:9.0.0'

    // Desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'

//    //TODO:: Delete before production
//    // browse local db
  //  debugImplementation 'com.github.amitshekhariitbhu.Android-Debug-Database:debug-db:v1.0.7'
}